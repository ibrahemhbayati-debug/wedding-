<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف مباركة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0b0b; font-family: 'Cairo', sans-serif; color: #fff; min-height: 100vh; overflow-x: hidden; text-align: center; }
        
        .hero { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1000&q=80') no-repeat center center/cover; }
        
        h1 { font-size: 2.5rem; margin-bottom: 15px; color: #d4af37; animation: fadeInDown 2s ease-in-out; }
        .subtitle { font-size: 1.2rem; margin-bottom: 30px; color: #e0e0e0; max-width: 600px; line-height: 1.8; opacity: 0; animation: fadeInUp 2s ease-in-out 1s forwards; }
        
        .music-control { margin-top: 20px; background: #d4af37; color: #000; border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); animation: pulse 2s infinite; }
        .music-control:hover { background: #b8860b; color: #fff; }

        .details-section { padding: 80px 20px; background: #141414; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card { background: #1f1f1f; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; width: 100%; margin: 0 auto; border: 1px solid #d4af37; }
        .countdown { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
        .time-box { background: #2a2a2a; border: 1px solid #d4af37; border-radius: 10px; padding: 10px; min-width: 70px; }
        .time-box span { display: block; font-size: 1.4rem; font-weight: bold; color: #d4af37; }
        .time-box label { font-size: 0.8rem; color: #aaa; }
        .btn { display: inline-block; background: #d4af37; color: #000; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background: #b8860b; color: #fff; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50%
<body>
    <audio id="weddingAudio" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
    </audio>

    <div class="hero">
        <h1>إنه ليله سعيدة</h1>
        <p class="subtitle">يسرنا دعوتكم لحضور حفل زفافنا المبارك وتشاركونا أجمل لحظات العمر، حيث تبدأ حكاية حبنا الأبدية.</p>
        <button class="music-control" onclick="startExperience()">اضغط هنا لبدء الدعوة والموسيقى 🎶</button>
    </div>

    <div class="details-section">
        <div class="card">
            <h2 style="color: #d4af37; margin-bottom: 15px;">العد التنازلي للقاء الفرح</h2>
            <div class="countdown">
                <div class="time-box"><span id="days">00</span><label>يوم</label></div>
                <div class="time-box"><span id="hours">00</span><label>ساعة</label></div>
                <div class="time-box"><span id="minutes">00</span><label>دقيقة</label></div>
                <div class="time-box"><span id="seconds">00</span><label>ثانية</label></div>
            </div>
            <p style="margin: 20px 0; color: #ddd; line-height: 1.6;">يسعدنا حضوركم واحتفالكم معنا في قاعة الأفراح المباركة.</p>
            <a href="https://maps.google.com" target="_blank" class="btn">موقع القاعة على الخريطة</a>
        </div>
    </div>

    <script>
        function startExperience() {
            const audio = document.getElementById("weddingAudio");
            audio.play().catch(e => console.log("Audio play blocked"));
            window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
        }

        const weddingDate = new Date("Nov 1, 2026 20:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = weddingDate - now;
            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);
    </script>
</body>
</html>
