<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف مباركة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #fdfbf7, #f4ecd8); font-family: 'Cairo', sans-serif; color: #5c4033; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(92, 64, 51, 0.1); max-width: 450px; width: 100%; text-align: center; border: 2px solid #d4af37; }
        h1 { font-size: 1.8rem; margin-bottom: 15px; color: #b8860b; }
        .text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; color: #6e5345; }
        .countdown { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
        .time-box { background: #fbf6f4; border: 1px solid #d4af37; border-radius: 10px; padding: 10px; min-width: 70px; }
        .time-box span { display: block; font-size: 1.4rem; font-weight: bold; color: #b8860b; }
        .time-box label { font-size: 0.8rem; color: #6e5345; }
        .btn { display: inline-block; background: #b8860b; color: white; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background: #996f08; }
    </style>
</head>
<body>
    <div class="card">
        <h1>إنه ليله سعيدة</h1>
        <p class="text">يسرنا دعوتكم لحضور حفل زفافنا المبارك، وتشاركونا أجمل لحظات العمر.</p>
        <div class="countdown">
            <div class="time-box"><span id="days">00</span><label>يوم</label></div>
            <div class="time-box"><span id="hours">00</span><label>ساعة</label></div>
            <div class="time-box"><span id="minutes">00</span><label>دقيقة</label></div>
            <div class="time-box"><span id="seconds">00</span><label>ثانية</label></div>
        </div>
        <a href="https://maps.google.com" target="_blank" class="btn">موقع القاعة على الخريطة</a>
    </div>
    <script>
        const weddingDate = new Date("Nov 1, 2026 20:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = weddingDate - now;
            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);
    </script>
</body>
</html>
